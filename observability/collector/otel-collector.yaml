# Un receptor OTLP sin auth en localhost:4318, dos destinos (ADR-0008):
#
# - Langfuse local recibe todas las trazas: las del sistema y las nativas de Claude
#   Code, con prompts y respuestas. Existe porque el exportador OTel de Claude Code
#   no puede mandar un header con espacio ("Basic <b64>") desde
#   OTEL_EXPORTER_OTLP_HEADERS. De paso traduce los tokens de Claude Code a lo que
#   Langfuse pricea (`transform/claude_code_usage`).
# - Grafana Cloud recibe solo lo que emite el sistema (service.name agentic-system):
#   trazas sin el título de la tarea, y las métricas del sistema. Nada de Claude
#   Code sale a la nube: sus spans llevan contenido.
#
# Necesita la imagen contrib: `filter` con OTTL y `basicauth` no están en la core.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

extensions:
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_OTLP_INSTANCE_ID}
      password: ${env:GRAFANA_OTLP_TOKEN}

processors:
  batch:

  # Deja pasar solo lo que emite el sistema. Claude Code se identifica como otro servicio.
  filter/system_only:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["service.name"] != "agentic-system"
    metrics:
      metric:
        - resource.attributes["service.name"] != "agentic-system"

  # El título del issue es contenido, no metadato: se queda en local.
  attributes/drop_title:
    actions:
      - key: task.title
        action: delete

  # Las métricas del sistema son gauges, una muestra por evento (ADR-0008, adenda):
  # pasan tal cual, sin acumular. Antes había un `deltatocumulative` acá; un collector
  # levantado con la config vieja lo conserva hasta que se lo recree, y no molesta.

  # Claude Code manda los tokens de cada llamada al modelo con nombres propios
  # (`input_tokens`, `cache_read_tokens`...); Langfuse solo pricea `gen_ai.usage.*`. Se
  # copian con las claves de la tabla de precios de Langfuse, sin borrar los originales,
  # y Langfuse calcula el costo de cada `claude_code.llm_request` (ADR-0008, adenda). El
  # sistema no manda dólares: el costo de un rol o de una tarea en Langfuse es la suma de
  # sus llamadas. `Int()` porque Langfuse no pricea un contador que llegue como texto.
  # Verificar con `uv run observability/collector/probe.py` después de recrear el collector.
  transform/claude_code_usage:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - name == "claude_code.llm_request"
        statements:
          - set(attributes["gen_ai.usage.input_tokens"], Int(attributes["input_tokens"])) where attributes["input_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], Int(attributes["output_tokens"])) where attributes["output_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_read_input_tokens"], Int(attributes["cache_read_tokens"])) where attributes["cache_read_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_creation_input_tokens"], Int(attributes["cache_creation_tokens"])) where attributes["cache_creation_tokens"] != nil

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_BASIC}"
      x-langfuse-ingestion-version: "4"

  otlphttp/grafana:
    # https://otlp-gateway-<region>.grafana.net/otlp; el exporter agrega /v1/traces y /v1/metrics.
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana

service:
  extensions: [basicauth/grafana]
  pipelines:
    traces/langfuse:
      receivers: [otlp]
      processors: [transform/claude_code_usage, batch]
      exporters: [otlphttp/langfuse]
    traces/grafana:
      receivers: [otlp]
      processors: [filter/system_only, attributes/drop_title, batch]
      exporters: [otlphttp/grafana]
    metrics/grafana:
      receivers: [otlp]
      processors: [filter/system_only, batch]
      exporters: [otlphttp/grafana]
