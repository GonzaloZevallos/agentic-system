# Un receptor OTLP sin auth en localhost:4318, un solo destino (ADR-0037, que
# reemplaza la mitad Grafana de ADR-0008): Langfuse local recibe todas las trazas,
# las del sistema y las nativas de Claude Code, con prompts y respuestas. Existe
# porque el exportador OTel de Claude Code no puede mandar un header con espacio
# ("Basic <b64>") desde OTEL_EXPORTER_OTLP_HEADERS. De paso traduce los tokens de
# Claude Code a lo que Langfuse pricea (`transform/claude_code_usage`).
#
# Grafana Cloud, su exportador, su extensión de auth y los dos processors que solo
# existían para alimentarla (`filter/system_only`, `attributes/drop_title`) salieron
# de acá (ADR-0037): ninguno tenía efecto sobre la pipeline de Langfuse, así que
# `traces/langfuse` y `transform/claude_code_usage` quedan byte a byte como estaban.
#
# Necesita la imagen contrib por `transform` (OTTL); ya no por `filter` ni por
# `basicauth`, que sólo estaban acá por Grafana.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

  # Las métricas del sistema son gauges, una muestra por evento (ADR-0008, adenda):
  # pasan tal cual, sin acumular. Antes había un `deltatocumulative` acá; un collector
  # levantado con la config vieja lo conserva hasta que se lo recree, y no molesta.

  # Claude Code manda los tokens de cada llamada al modelo con nombres propios
  # (`input_tokens`, `cache_read_tokens`...); Langfuse solo pricea `gen_ai.usage.*`. Se
  # copian con las claves de la tabla de precios de Langfuse, sin borrar los originales,
  # y Langfuse calcula el costo de cada `claude_code.llm_request` (ADR-0008, adenda). El
  # sistema no manda dólares: el costo de un rol o de una tarea en Langfuse es la suma de
  # sus llamadas. `Int()` porque Langfuse no pricea un contador que llegue como texto.
  # Verificar con `uv run observability/collector/probe.py` después de recrear el collector.
  #
  # Langfuse lee `gen_ai.usage.input_tokens` con la convención de OpenAI, donde el input
  # incluye la caché, y le resta lectura y escritura de caché para quedarse con el input
  # sin cachear. Anthropic ya lo manda sin cachear, así que se le suman las dos partes de
  # caché antes: si no, Langfuse lo deja en 0 y cobra solo caché y salida.
  transform/claude_code_usage:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - name == "claude_code.llm_request"
        statements:
          - set(attributes["gen_ai.usage.input_tokens"], Int(attributes["input_tokens"])) where attributes["input_tokens"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], Int(attributes["input_tokens"]) + Int(attributes["cache_read_tokens"]) + Int(attributes["cache_creation_tokens"])) where attributes["input_tokens"] != nil and attributes["cache_read_tokens"] != nil and attributes["cache_creation_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], Int(attributes["output_tokens"])) where attributes["output_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_read_input_tokens"], Int(attributes["cache_read_tokens"])) where attributes["cache_read_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_creation_input_tokens"], Int(attributes["cache_creation_tokens"])) where attributes["cache_creation_tokens"] != nil

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_BASIC}"
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    traces/langfuse:
      receivers: [otlp]
      processors: [transform/claude_code_usage, batch]
      exporters: [otlphttp/langfuse]
