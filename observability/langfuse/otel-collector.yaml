# Recibe OTLP de Claude Code sin auth y lo reenvía a Langfuse con Basic auth.
# Existe porque el exportador OTel de Claude Code no puede mandar un header con
# espacio ("Basic <b64>") desde OTEL_EXPORTER_OTLP_HEADERS.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_BASIC}"
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/langfuse]
