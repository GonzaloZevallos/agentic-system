      \ 1)**\" becomes \"**Current price (criterio 1)**\".\n   - Then run check (d)\
      \ over the prose of both files and fix every hit. The only hits allowed are\
      \ \"Stock y entradas\" and the backtick routes `/mi-stock/...`.\n   - Read every\
      \ rule sentence: \"precio\" may never stand for List price, Bulk price, VIP\
      \ price, Current price or Price entry.\n   - Where the base and the PM's text\
      \ differ on a digit, a backtick span or a bold term, the base wins.\n2. **Headings.**\
      \ Grep `docs/adr/` for every translated heading's English text. A match keeps\
      \ that heading in English, and the PR names it.\n3. **Citation sweep.**\n  \
      \ - Run `rg -n '(varieties|pricing-settings)\\.md'`.\n   - Also grep for each\
      \ old English heading and quoted sentence (the PM's old → new list) across `app/`,\
      \ `tests/`, `scripts/`, `web/src`, `web/e2e`, the other `docs/product/*.md`,\
      \ `CODING_STANDARDS.md` and `DESIGN_STANDARDS.md`.\n   - Change a citation only\
      \ when its quoted text existed exactly at the base and is now translated. Quotes\
      \ of these files' sentences in other docs move to the exact Spanish text.\n\
      \   - Leave these byte-identical, and list each one in a PR table (file, line,\
      \ quoted text, \"not present at base\"):\n     - \"The list\": `summaryLine.ts`,\
      \ `Variedades.tsx`, `Variedades.test.tsx`;\n     - \"A variety's page\": `VarietyPage.tsx`,\
      \ `VarietyPage.test.tsx`;\n     - \"Deleting and archiving\": `varieties.ts`,\
      \ `VarietyRemoval.tsx`, `VarietyRemoval.test.tsx`, `archivadas.spec.ts`;\n \
      \    - \"An archived …\": `VarietyReadOnlySections.test.tsx`;\n     - \"Deleting\
      \ an entry\": `priceDeleteNotice.test.ts`, and `priceDeleteNotice.ts` if it\
      \ quotes a section;\n     - \"Archivadas\": `ArchivedVarieties.tsx`, `useRestore.tsx`.\n\
      \   - Confirm that `\"Archived\"` (`Archivadas.test.tsx`, `routes.test.ts:440`)\
      \ and \"criterion 18\" (`messageSources.test.ts`) still resolve. Leave them\
      \ unchanged and say so in the PR.\n   - List `docs/product/design-system/pantallas/PrecioNuevo.dc.html:54`\
      \ as left alone: it is in an excluded directory.\n   - Never edit `docs/adr/`,\
      \ `docs/evidence/`, `docs/agents/`, `.agentic/` or `docs/product/design-system/`.\
      \ Keep comment lines at 100 characters or fewer.\n4. **Checks.** These are one-off:\
      \ do not commit the scripts. Run each per file against the English parent and\
      \ paste the output in the PR.\n   - (a) Identical spans. Translated bold labels\
      \ are listed as expected differences. Also verify:\n     - every \"Va a reemplazar\"\
