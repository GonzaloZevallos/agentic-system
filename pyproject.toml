[project]
name = "agentic-system"
version = "0.1.0"
description = "Sistema agéntico de desarrollo: roles sobre LangGraph con Claude Agent SDK como harness"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.0",
    "claude-agent-sdk>=0.2.152",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
agentic = "agentic.cli:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The skills plugin is a pinned submodule, not our code (ADR-0013).
extend-exclude = ["agentic/plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `llm` tests call the SDK with the subscription; CI does not have it (README.md, 14).
# Run them on purpose: `uv run pytest -m llm`.
addopts = "-m 'not llm'"
markers = ["llm: calls a real model through the Claude Agent SDK"]

[tool.mypy]
# The command (`checks.types` in .agentic/stack.yaml, the CI step) carries no paths:
# the checked scope lives here, widened one unit at a time (ADR-0021).
python_version = "3.13"
files = [
    "agentic/shared",
    "agentic/core/measurement/domain",
    "agentic/core/knowledge/domain",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
