[project]
name = "agentic-system"
version = "0.1.0"
description = "Sistema agéntico de desarrollo: roles sobre LangGraph con Claude Agent SDK como harness"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.0",
    "claude-agent-sdk>=0.2.152",
    "langgraph>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[project.scripts]
agentic = "agentic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `llm` tests call the SDK with the subscription; CI does not have it (DISENO.md, 14).
# Run them on purpose: `uv run pytest -m llm`.
addopts = "-m 'not llm'"
markers = ["llm: calls a real model through the Claude Agent SDK"]
