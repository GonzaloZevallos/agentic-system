# The template a product copies into `.agentic/stack.yaml` and commits. The system has no
# default: a product that declares no stack does not run (issue #36).
#
# `product`: the name this product goes by, a slug. Every span and every metric of a run
# carries it as a label, so two products never add up in a panel (issue #47). Declared and
# not guessed: a directory name changes when someone clones under another name.
product: my-product
# `checks`: what the product runs to say its code is sound. The presubmit runs them on a
# Developer's delivery, and the reviewer uses them to reproduce an objection (ADR-0016).
checks:
  tests: pytest
# `setup`: what prepares a fresh checkout to run those checks, once, when the system
# creates it. Optional, and what keeps a Developer's worktree from reaching for the
# product's shared environment (ADR-0011, third addendum). For a uv project:
#
# setup:
#   deps: uv sync --locked
#
# `witness`: optional. A single command, not a mapping like `checks` and `setup`, with
# which the product says where the code its checks just measured lives: the presubmit
# runs it in the Developer's checkout, before the checks, and refuses when its last
# printed line is not a path under that checkout (ADR-0024). Write it in the same
# runner form as the checks below, or it verifies a different process than the one
# that measured the code.
#
# witness: uv run python -c "import pathlib; print(pathlib.Path('.').resolve())"
#
# `parallel_checks`: optional, true or false. The presubmit runs the checks one after the
# other unless this is true; turn it on only when no two declared checks share a port, a
# database file or a cache (ADR-0044).
#
# parallel_checks: true
#
# `affected_checks` and `affected_fallback`: optional (ADR-0046). `affected_checks` gives a
# check, by the name it has under `checks`, a second command that runs only what the change
# can affect. Only the Developer's delivery gate and the reviewer use it; the merge never
# does, and always runs the full `checks`. `{base}` is replaced with the sha of the task's
# base, so the command measures the whole branch. It must appear in the command and not at
# its start. The command must exit non-zero when it selects nothing: do not add
# `--passWithNoTests` or an equivalent. When it fails the gate runs the full command. A
# change to any path matching `affected_fallback` runs the full commands too, and so does a
# change to `.agentic/stack.yaml`, always. In these globs `*` crosses `/`. If either key is
# present but empty (`{}`, `[]` or null), the stack fails to load and says the key is
# declared empty; leave the key out to declare none.
#
# affected_checks:
#   tests: npx vitest run --changed {base}
# affected_fallback:
#   - uv.lock
#   - tests/conftest.py
#
# `delivery_checks`: optional. The fast tier of a two-tier gate: a list of names under
# `checks`, the ones every subtask delivery runs. The rest of `checks` runs once per task,
# on the integrated head, before the pull request opens, and the merge gate still runs all
# of them. Absent, every delivery runs all of `checks`. A list equal to all of `checks` is
# valid: the full tier is then the run without `affected_checks`. A duplicate, an unknown
# name or an empty list fails to load.
#
# delivery_checks: [tests]
#
# `rerun_checks`: optional (ADR-0066). A red check reruns once inside the gate before it
# refuses; a pass on the rerun is a recorded flake, not a failure. This key gives a check, by
# the name it has under `checks`, a "failed tests only" form for the delivery gate's rerun, and
# a `test_id` regex whose one group names a failed test in the check's output (read over the
# last 64 KB, at most 50 ids). The form must not stop early (`-x`, `--maxfail`, `maxFailures`);
# the product chooses what an empty cache does (`--lfnf=none`); `{base}` is not substituted. It
# runs only when `test_id` found an id, otherwise the check's full command reruns; the merge
# gate and `full_checks` always rerun the full command. A form requires `delivery_checks`, so
# the full run on the integrated head covers what it skipped. `test_id` must compile, have
# exactly one group, be at most 200 characters and have no quantified group that contains a
# quantifier or an alternation. A check with no form still reruns, in full.
#
# rerun_checks:
#   tests:
#     command: uv run pytest -m "not llm" --lf --lfnf=none
#     test_id: "(?m)^FAILED (\\S+)"
#
# `check_budgets`: optional (GH-365). The seconds each check may take, by the name it has under
# `checks`: a positive number. It is compared only by the once-per-task `full_checks` run on
# the integrated head -- never by the delivery gate or the merge -- so it requires
# `delivery_checks`. Per check, never per tier: under `parallel_checks` a tier's wall time is
# not the sum of its checks. A check over its budget is recorded, it blocks nothing.
#
# check_budgets:
#   tests: 600
#
# `merge_inert`: optional (ADR-0045, amendment). The globs of the paths none of the checks
# reads. When master moves, the merge reuses a recorded pass only if everything master gained
# since matches one of these (never `.agentic/stack.yaml`, `.github/**` or other
# configuration, whatever is declared). A glob that matches everything (`*`, `**`, `*.md`), an
# absolute path or a `..` segment is refused. Declare a path only if no test or check reads it.
#
# merge_inert:
#   - "docs/assets/**"
#
# `forbidden`: optional. A list of rules the Edit/Write hook denies a Developer from
# adding: each names a `pattern`, the `extensions` it applies to, and the `reason` a
# denial carries verbatim. One that was already in the file is not the task's. What a
# suppression looks like in this product's own tools is this key's to spell, never the
# system's -- see this repo's own `.agentic/stack.yaml` for a worked declaration.
#
# `design`: optional (ADR-0040). Without it, a task with `touches_ui` still runs, on
# text alone: no rendered screen, no comparison. Four pieces, two required once the
# block is there:
#
# design:
#   prototype: docs/product/design-system/pantallas  # the static screens' directory
#   entry: Home                                       # the screen a walk starts from
#   sample_app: npm run dev                           # optional: starts the real app,
#                                                      # prints its address and user
#   compare: npm run compare                          # optional: renders this task's
#                                                      # comparisons, prints the paths
#
# `ci`: optional. The exact check-run names of the product's GitHub CI that gate a merge
# (ADR-0045). With it, `agentic merge` decides from those checks on the reviewed head and
# reruns nothing locally unless master moved since the run. A name is matched whole, never
# by prefix: write it as GitHub reports it. Never list a conditional job, which a skipped
# run reads as red; list a matrix job by each of its expanded names, `name (value)`.
#
# ci: [check]
#
# `performance`: optional (GH-318, ADR-0059). Scenarios `agentic perf <product>` measures
# against absolute limits, with a realistic data volume. They never join `checks`: the
# presubmit, `affected_checks`, `ci` and the merge gate do not see them. `seed` and
# `measure` are one-line commands (no `git push`, `gh`, `curl` or `wget`) that run in a
# throwaway checkout with a scrubbed environment and receive `PERF_VOLUME` and
# `PERF_VOLUME_UNIT`. `measure` prints, as its last line, one JSON object and never
# judges: {"volume": 1000, "volume_unit": "rows", "metrics": {"list_ms": 12.5}}. A limit's
# key ends in its unit: `_ms`, `_queries` or `_kb`.
#
# performance:
#   list_orders:
#     seed: python scripts/seed.py
#     measure: python scripts/measure_list.py
#     volume: 10000
#     volume_unit: rows              # rows | days | months | years
#     limits: {list_ms: {limit: 300, unit: ms}, list_queries: {limit: 4, unit: queries}}
