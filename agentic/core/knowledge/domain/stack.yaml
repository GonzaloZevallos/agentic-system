# The template a product copies into `.agentic/stack.yaml` and commits. The system has no
# default: a product that declares no stack does not run (issue #36).
#
# `product`: the name this product goes by, a slug. Every span and every metric of a run
# carries it as a label, so two products never add up in a panel (issue #47). Declared and
# not guessed: a directory name changes when someone clones under another name.
product: my-product
# `checks`: what the product runs to say its code is sound. The presubmit runs them on a
# Developer's delivery, and the reviewer uses them to reproduce an objection (ADR-0016).
checks:
  tests: pytest
# `setup`: what prepares a fresh checkout to run those checks, once, when the system
# creates it. Optional, and what keeps a Developer's worktree from reaching for the
# product's shared environment (ADR-0011, third addendum). For a uv project:
#
# setup:
#   deps: uv sync --locked
#
# `witness`: optional. A single command, not a mapping like `checks` and `setup`, with
# which the product says where the code its checks just measured lives: the presubmit
# runs it in the Developer's checkout, before the checks, and refuses when its last
# printed line is not a path under that checkout (ADR-0024). Write it in the same
# runner form as the checks below, or it verifies a different process than the one
# that measured the code.
#
# witness: uv run python -c "import pathlib; print(pathlib.Path('.').resolve())"
