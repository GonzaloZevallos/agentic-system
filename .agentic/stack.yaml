# The stack of this repo as a product (ADR-0017): the same commands CI runs, not an
# approximation. The presubmit runs the checks on a Developer's delivery, and the
# reviewer uses them to reproduce an objection (ADR-0016).
#
# `product` is the label every span and every metric of a run over this repo carries
# (issue #47). This repo is the system and, since ADR-0017, also its second product; the
# name is the repository's, which is what a panel compares against the gym's.
#
# `setup` runs once, when the system creates a checkout, and is what keeps a worktree
# from reaching up to this checkout's `.venv` (ADR-0011, third addendum). The three
# checks below are `uv run` in project mode, which already builds a per-worktree
# environment; `uv sync --locked` makes that a guarantee of the system and not a
# property of how the commands happen to be written.
# `witness`: this repo's own contract, proved by `tests/test_stack.py` (ADR-0024). It
# has to go through the same `uv run` project mode as the checks below:
# `without_own_toolchain` strips `VIRTUAL_ENV`, every `UV_*` and that venv's `bin/` off
# `PATH`, so a bare `python -c "import agentic"` would raise `ModuleNotFoundError` in a
# fresh worktree -- an environment problem, not a checkout one.
#
# `forbidden`: the cage that used to be `adapters/claude_sdk/hooks.py`'s own `_SILENCED`
# and `_PYTHON` constants (issue #38, ADR-0011 addendum), moved here byte for byte in
# `pattern` and `extensions` -- the bar over this product is provably unchanged by the
# move. `reason` is written fresh: the old constant's own text told a Developer to
# narrow with `cast`, which this repo's ADR-0021 forbids outright, and the very form
# ADR-0021 does sanction still matches this same pattern. This declaration is read at
# a task's base, never at HEAD (`core.knowledge.domain.stack`), so it does not govern
# the task that introduces it -- only the one after it merges.
product: agentic-system
setup:
  deps: uv sync --locked
checks:
  tests: uv run pytest -m "not llm"
  lint: uv run ruff check .
  format: uv run ruff format --check .
  types: uv run mypy
# `parallel_checks`: the gate runs the four checks above at once. Five concurrent runs of
# them gave no red that the serial run did not give (ADR-0044, "Evidencia para este repo").
# Read at a task's base, like every key here: it governs from the task after the merge.
parallel_checks: true
# The affected-only form of the pytest check (ADR-0046), selected by `scripts/affected_tests.py`
# (ADR-0047): the tests whose import closure reaches the change, an explicit table for what
# tests read without importing it, and exit 8/9 when it selects nothing or cannot decide.
# `lint`, `format` and `types` stay full: they are fast. A path matching a glob below runs
# the full suite (ADR-0046); `tests/test_affected_tests.py` reads this list through the
# stack parser and fails when a test reads a repo path that nothing here or in the script's
# table covers. This list lives only here.
affected_checks:
  tests: uv run python scripts/affected_tests.py {base}
affected_fallback:
  - pyproject.toml
  - uv.lock
  - "*conftest.py"
  - "agentic/shared/*"
  - agentic/composition.py
  - agentic/cli.py
  - "agentic/*/prompts/*"
  - "agentic/plugins/*"
  - "*CONTEXT*.md"
  - ".github/*"
  - "scripts/*"
  - .env.example
# `delivery_checks`: the fast tier, the checks every subtask delivery runs. All four names are
# listed, so the tier is the whole of `checks` and what changes is the form: the delivery gate
# may use the affected form of `tests` above, and the full tier is pytest without it, run once
# per task on the integrated head, before the pull request opens. The merge gate still runs
# all of `checks`. Read at a task's base, like every key here: it governs from the task after
# the merge.
delivery_checks: [tests, lint, format, types]
# `check_budgets`: the seconds the `docs` check may take on the full run (GH-365 made the key;
# GH-400, ADR-0076, sets this value). Measured: one `generate.py` run takes about 63 s idle and
# 154 s with the machine loaded (eleven pyreverse runs, the import of the CLI and the compile of
# the graph); the budget is the loaded time times 1.5, rounded up.
check_budgets:
  docs: 231
# `docs`: the generated documentation (ADR-0074). `generate` rewrites every file the globs
# own; the reserved `docs` check runs it and fails when the tree changed, and CI runs the same
# command through `scripts/docs/check.py`. Hand-written pages never go under these globs.
docs:
  generate: uv run python scripts/docs/generate.py
  paths: ["docs/architecture/generated/**", "docs/reference/**"]
# `merge_inert`: the paths master may gain without a recorded check pass going stale (ADR-0045,
# amendment). Only the task documents: no test or check reads this repo's own
# `.agentic/tasks/` (the tests build their own under tmp_path, and `scripts/affected_tests.py`
# IGNOREs it on the same grounds). `docs/**` is NOT declared: tests read `docs/adr/`. Read at
# the pull request head, like every key here.
merge_inert:
  - ".agentic/tasks/*.md"
witness: uv run python -c "import agentic, pathlib; print(pathlib.Path(agentic.__file__).resolve().parent)"
forbidden:
  - pattern: '#\s*(type:\s*ignore|noqa)\b'
    extensions: [.py, .pyi]
    reason: >-
      this adds a type-checker or linter suppression. ADR-0021 is this repo's dial:
      fix the type, or take the unit out of `[tool.mypy] files` in `pyproject.toml`
      and say so in the pull request.
# `ci`: the check-run names of ci.yml that gate a merge (ADR-0045, GH-216 amendment): with
# it, `agentic merge` decides from GitHub's CI on the reviewed head. `check` is the one
# job of `.github/workflows/ci.yml`, unconditional and without a matrix. Read at a task's
# base, like every key here: it governs from the task after the merge.
# If Actions stops reporting, the merge waits up to `ci.CI_WAIT_MAX_S` and then landing
# diagnoses (ADR-0048). Commenting this key out again is a human decision.
ci: [check]
